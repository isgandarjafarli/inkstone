<!doctype html><html><head><meta charset="utf-8"><style>
/* One App Store screenshot: a headline over a phone. Filled in by render.js. */
:root { --bg1:#F6F3EC; --bg2:#EFE8DC; --ink:#1C1B19; --ink2:#5E5B55; --seal:#C23A2B; }
* { box-sizing:border-box; margin:0; }
body { width:1320px; height:2868px; overflow:hidden; font-family: 'Inter Display', Inter, -apple-system, 'SF Pro Display', sans-serif;
  background: radial-gradient(1200px 900px at 85% 8%, rgba(194,58,43,.10), transparent 70%), linear-gradient(180deg, var(--bg1), var(--bg2)); color:var(--ink); }
.head { position:absolute; left:110px; right:110px; top:190px; }
h1 { font-size:116px; line-height:1.04; font-weight:750; letter-spacing:-3px; }
h1 em { font-style:normal; color:var(--seal); }
p { font-size:50px; line-height:1.32; color:var(--ink2); margin-top:34px; font-family: Inter, -apple-system, sans-serif; font-weight:450; }
.phone { position:absolute; left:50%; transform:translateX(-50%); top:__TOP__px; width:940px; padding:24px; border-radius:140px; background:#1C1B19;
  box-shadow: 0 60px 120px rgba(40,30,20,.28), 0 12px 30px rgba(40,30,20,.16); }
.phone img { display:block; width:100%; border-radius:116px; }
</style></head><body>
<div class="head"><h1>__H1__</h1><p>__P__</p></div>
<div class="phone"><img src="__IMG__"></div>
</body></html>
