name: Build and test

on:
  push:
    branches-ignore: [ci-results]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          d = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in d if "iOS" in k), key=lambda k: [int(x) for x in re.findall(r"\d+", k)])
          for rt in reversed(runtimes):
              phones = [x for x in d[rt] if x["name"].startswith("iPhone")]
              pro = [x for x in phones if re.fullmatch(r"iPhone \d+ Pro", x["name"])]
              pick = (pro or phones or [None])[0]
              if pick:
                  print(pick["udid"]); break
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Build and run unit tests (simulator)
        run: |
          set -o pipefail
          xcodebuild test -project Inkstone.xcodeproj -scheme Inkstone \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-sim.log | grep -E "error:|warning: .*(deprecated|never)|Test Suite|Executed|BUILD|\*\*" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build-sim.log

      - name: Build for iPhone (unsigned)
        if: always()
        run: |
          set -o pipefail
          xcodebuild build -project Inkstone.xcodeproj -scheme Inkstone -configuration Release \
            -destination "generic/platform=iOS" -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-device.log | grep -E "error:|BUILD|\*\*" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build-device.log
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/Inkstone.app Payload/
          zip -qry Inkstone-unsigned.ipa Payload

      - name: Screenshots
        if: success()
        run: scripts/screenshots.sh "${{ steps.sim.outputs.udid }}" build/sim/Build/Products/Debug-iphonesimulator/Inkstone.app screenshots

      - name: Watch screenshots
        if: success()
        continue-on-error: true
        run: scripts/watch-screenshots.sh build/sim/Build/Products/Debug-watchsimulator/InkstoneWatch.app screenshots 2>&1 | tee watch-shots.log

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Upload app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Inkstone-unsigned-ipa
          path: Inkstone-unsigned.ipa

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: "*.log"

      - name: Publish results to the ci-results branch
        if: always()
        run: |
          set -e
          mkdir -p /tmp/results
          cp -R screenshots /tmp/results/ 2>/dev/null || true
          cp *.log /tmp/results/ 2>/dev/null || true
          cp Inkstone-unsigned.ipa /tmp/results/ 2>/dev/null || true
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "xcode: $(xcodebuild -version | head -1)"
            echo "tests: $(grep -c "passed (" build-sim.log 2>/dev/null || echo 0) passed, $(grep -c "failed (" build-sim.log 2>/dev/null || echo 0) failed"
            echo "watch app built: $([ -d build/sim/Build/Products/Debug-watchsimulator/InkstoneWatch.app ] && echo yes || echo no)"
            echo "screenshots: $(ls screenshots 2>/dev/null | wc -l | tr -d ' ')"
            grep -h "failed (" build-sim.log 2>/dev/null | head -20 || true"
            grep -h "error:" build-sim.log build-device.log 2>/dev/null | sort -u | head -80 || true
          } > /tmp/results/SUMMARY.txt
          cd /tmp/results
          git init -q
          git checkout -q -b ci-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build results for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
